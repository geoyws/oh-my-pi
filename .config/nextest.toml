# nextest runs every test in its own process and schedules them in parallel
# across the whole workspace, so anything that relied on `cargo test`'s
# one-binary-at-a-time execution has to declare that here.
#
# Doctests are NOT run by nextest (upstream limitation: they have no stable
# libtest-json interface). `scripts/run-rs-task.ts` pairs the nextest run with
# `cargo test --doc`, which runs every runnable doctest in the workspace's lib
# crates. Today that is tree-sitter-go's one example: pi-natives is a `cdylib`
# (rustdoc collects no doctests from it) and pi-builtins' examples are
# `ignore`d vendored uutils docs.

[profile.default]
# Print each failure when it happens and again in the final summary — a run
# that fails early in a long workspace sweep should not need scrollback.
failure-output = "immediate-final"
# Report every failing test in one pass instead of stopping at the first.
fail-fast = false

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
# No retries: a flaky test is a bug we want to see, not paper over.
retries = 0
slow-timeout = { period = "60s", terminate-after = 4 }

# pi-shell's cancellation tests race real child processes against the 1 s
# POSIX TERM grace: a trap must fork, sleep past the old 500 ms reader cancel
# and write before the KILL wave. Their in-file `shell_test_lock` serialized
# them under `cargo test`, but nextest gives each test its own process, so the
# lock no longer holds and a full parallel sweep starves the trap's `sleep`
# past the grace (omp t-34dd9e20). Run them with the runner to themselves.
[[profile.default.overrides]]
filter = 'package(pi-shell) & test(/^shell::tests::cancel/)'
threads-required = "num-test-threads"

# The deep-chain walk tests build and delete a directory chain as deep as the
# host's path syscalls reach. That saturates the filesystem for as long as they
# run, which pushes tests elsewhere in the workspace past their own latency
# assertions (pi-natives' OAuth callback wake, pi-shell's TERM-trap cleanup).
# Each takes every test thread, so it runs alone.
[[profile.default.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"

# The rsync conformance tests diff the builtin against the external reference
# rsync 3.5.1: they spawn its processes and daemons, run up to four scenarios
# at once on their own threads, and copy multi-megabyte fixtures per run. The
# reference's output already varies with scheduling, and a saturated machine
# starves its daemons past their readiness deadline. Each takes every test
# thread, so it runs alone.
[[profile.default.overrides]]
filter = 'test(/^rsync::conformance::/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(/^rsync::conformance::/)'
threads-required = "num-test-threads"
